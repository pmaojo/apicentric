name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  # Dry run: builds every release binary without publishing anything.
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  verify-version:
    name: Verify version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Compare tag with Cargo.toml
        id: version
        run: |
          CRATE_VERSION=$(grep -m1 '^version = ' Cargo.toml | cut -d '"' -f2)
          echo "version=${CRATE_VERSION}" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v${CRATE_VERSION}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${CRATE_VERSION}"
            exit 1
          fi

  build:
    name: Build ${{ matrix.artifact }}
    needs: verify-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: apicentric-linux-x64
            ext: tar.gz
            features: --features full

          # Simulator-only build, downloaded by other repositories instead of compiling.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: apicentric-simulator-linux-x64
            ext: tar.gz
            features: --no-default-features --features simulator,scripting,file-watch

          # Cross-compiled from the ARM runner; the macOS SDK ships both architectures.
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: apicentric-macos-x64
            ext: tar.gz
            features: --features full

          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: apicentric-macos-arm64
            ext: tar.gz
            features: --features full

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: apicentric-windows-x64
            ext: zip
            features: --features full

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.artifact }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }} --bin apicentric ${{ matrix.features }}

      - name: Check binary
        shell: bash
        run: |
          BIN=target/${{ matrix.target }}/release/apicentric
          [ "${{ runner.os }}" = "Windows" ] && BIN="${BIN}.exe"
          if command -v file > /dev/null; then file "$BIN"; fi
          case "${{ matrix.target }}" in
            x86_64-apple-darwin) file "$BIN" | grep -q x86_64 ;;
            aarch64-apple-darwin) file "$BIN" | grep -q arm64 ;;
          esac
          # The x64 macOS binary is cross-compiled and may not run on the ARM runner.
          if [ "${{ matrix.target }}" != "x86_64-apple-darwin" ]; then
            "$BIN" --version
          fi

      - name: Package (Unix)
        if: matrix.ext == 'tar.gz'
        run: tar czf ${{ matrix.artifact }}.tar.gz -C target/${{ matrix.target }}/release apicentric

      - name: Package (Windows)
        if: matrix.ext == 'zip'
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../${{ matrix.artifact }}.zip apicentric.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.${{ matrix.ext }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [verify-version, build]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: |
          for f in *.tar.gz *.zip; do
            sha256sum "$f" > "$f.sha256"
          done
          sha256sum *.tar.gz *.zip > checksums.txt
          cat checksums.txt
          # Every archive must be present before publishing.
          for a in apicentric-linux-x64.tar.gz apicentric-simulator-linux-x64.tar.gz \
                   apicentric-macos-x64.tar.gz apicentric-macos-arm64.tar.gz apicentric-windows-x64.zip; do
            grep -q "  $a\$" checksums.txt || { echo "::error::missing $a"; exit 1; }
          done

      - name: Extract release notes
        env:
          VERSION: ${{ needs.verify-version.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "::error::No CHANGELOG.md section for ${VERSION}"
            exit 1
          fi
          cat >> release_notes.md << 'EOF'

          ## Downloads

          | Platform | Archive |
          |---|---|
          | Linux x64 | `apicentric-linux-x64.tar.gz` |
          | Linux x64 (simulator only) | `apicentric-simulator-linux-x64.tar.gz` |
          | macOS x64 | `apicentric-macos-x64.tar.gz` |
          | macOS ARM64 | `apicentric-macos-arm64.tar.gz` |
          | Windows x64 | `apicentric-windows-x64.zip` |

          Every archive has a matching `.sha256` file, and `checksums.txt` lists all of them:

          ```bash
          sha256sum -c checksums.txt --ignore-missing
          ```
          EOF

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          body_path: release_notes.md
          fail_on_unmatched_files: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
            dist/checksums.txt

  publish:
    name: Publish to crates.io
    needs: [verify-version, release]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          VERSION: ${{ needs.verify-version.outputs.version }}
        run: |
          # Re-running a release must not fail because the crate is already on crates.io.
          if curl -fsS -A "apicentric-release (github.com/pmaojo/apicentric)" \
              "https://crates.io/api/v1/crates/apicentric/${VERSION}" > /dev/null; then
            echo "apicentric ${VERSION} is already on crates.io; skipping."
            exit 0
          fi
          cargo publish --locked
